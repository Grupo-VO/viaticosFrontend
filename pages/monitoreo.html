<div class="page-content">
  <div class="page-header">
    <div>
      <h4><i class="fas fa-satellite-dish me-2 page-title-icon"></i>Monitoreo</h4>
      <small class="text-muted">Viajes en curso en tiempo real</small>
    </div>
    <div class="d-flex gap-2 align-items-center">
      <span class="monitoreo-live"><span class="live-dot"></span> En vivo</span>
      <button class="btn btn-light btn-sm" id="btnRefreshMonitoreo" title="Actualizar ahora"><i class="fas fa-sync-alt"></i></button>
    </div>
  </div>

  <div id="monitoreoContainer">
    <div class="empty-state"><i class="fas fa-satellite-dish"></i><p>Cargando monitoreo...</p></div>
  </div>
</div>

<!-- Modal Detalle Viaje -->
<div class="modal fade" id="monitoreoVerModal" tabindex="-1">
  <div class="modal-dialog modal-dialog-centered modal-xl">
    <div class="modal-content border-0 shadow">
      <div class="modal-header border-0">
        <h5 class="modal-title fw-bold" id="monitoreoVerTitulo">Detalle en Tiempo Real</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <div class="row g-3">
          <div class="col-lg-5">
            <div class="detail-grid mb-3" id="monitoreoVerInfo"></div>
            <div class="modal-section-title">Alertas</div>
            <div id="monitoreoVerAlertas"><div class="empty-state"><p>Sin alertas</p></div></div>
          </div>
          <div class="col-lg-7">
            <div class="modal-section-title">Ubicacion</div>
            <div class="map-container map-lg" id="monitoreoMap"><div class="map-placeholder"><i class="fas fa-map"></i><span>Cargando mapa...</span></div></div>
            <div class="modal-section-title mt-3">Destinos</div>
            <div class="panel-card overflow-hidden">
              <table class="table table-custom mb-0">
                <thead><tr><th>#</th><th>Nombre</th><th>Estado</th><th>Llegada</th></tr></thead>
                <tbody id="monitoreoVerDestinosBody"></tbody>
              </table>
            </div>
          </div>
        </div>
      </div>
      <div class="modal-footer border-0 justify-content-center">
        <button type="button" class="btn btn-light px-4" data-bs-dismiss="modal">Cerrar</button>
      </div>
    </div>
  </div>
</div>
